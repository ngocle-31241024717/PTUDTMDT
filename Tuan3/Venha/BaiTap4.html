<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài Tập 4 - Menu Ngang</title>
    <style>
        ul {
            list-style-type: none;
            padding: 0;
            margin: 20px;
        }
        ul li {
            display: inline-block;
            background-color: #2b6dad;
            margin-right: 4px;
            border-radius: 3px;
        }
        ul li a {
            display: inline-block;
            color: white;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-weight: bold;
            padding: 10px 20px;
        }
        ul li:hover {
            background-color: #1b4979;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="#">TMĐT</a></li>
        <li><a href="#">ERP</a></li>
        <li><a href="#">MIS</a></li>
        <li><a href="#">DS</a></li>
    </ul>
</body>
</html>
