        .galerry {

            padding: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 20px;
        }
        .galerry li {
            width: calc(33.333% - 14px);
            box-sizing: border-box;

        .galerry li img {
            width: 100%;
            height: auto;
