<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài Tập 7 - Layout</title>
    <style>
        #wrapper {
            width: 500px;
            margin: 30px auto;
            border: 4px solid #000;
            padding: 12px;
            font-family: Arial, sans-serif;
            font-size: 28px;
            box-sizing: border-box;
            background: #fff;
        }
        header {
            border: 3px solid #000;
            height: 60px;
            padding: 10px;
            margin-bottom: 12px;
        }
        nav {
            border: 3px solid #000;
            width: 25%;
            height: 280px;
            float: left;
            padding: 10px;
            box-sizing: border-box;
        }
        main {
            border: 3px solid #000;
            width: 72%;
            height: 280px;
            float: right;
            padding: 10px;
            box-sizing: border-box;
        }
        footer {
            clear: both;
            border: 3px solid #000;
            height: 55px;
            padding: 10px;
            margin-top: 295px;
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <header>header</header>
        <nav>nav</nav>
        <main>main</main>
        <footer>footer</footer>
    </div>
</body>
</html>
